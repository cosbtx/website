name: Email reputation check

on:
  schedule:
    - cron: '0 13 * * *'   # daily ~13:00 UTC (~7 AM Central)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Mailgun bounce and complaint rates
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
          MAILGUN_FROM: ${{ vars.MAILGUN_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python3 .github/scripts/reputation_check.py
