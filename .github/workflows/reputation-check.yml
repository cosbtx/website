name: Email reputation check

# Daily check of Mailgun bounce and complaint rates. Stays silent when healthy;
# emails ALERT_EMAIL (and fails the run) when provider-facing bounce tops 2% or
# complaints top 0.1%. Reuses the MAILGUN_API_KEY secret. Also runnable manually.

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (~7:00 AM Central)
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Mailgun bounce and complaint rates
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
          MAILGUN_FROM: ${{ vars.MAILGUN_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python3 .github/scripts/reputation_check.py
